<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Noomly</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{brand:{50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81'}}}}}</script>
<style>*{font-family:'Inter',sans-serif}body{transition:background-color .3s,color .3s}</style>
</head>
<body class="bg-slate-50 dark:bg-[#0a0a0f] text-slate-900 dark:text-slate-100 min-h-screen">
<div class="min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">
<div class="text-center mb-8">
<a href="/" class="inline-flex items-center gap-2.5 mb-6">
<img src="/static/logo.svg" alt="Noomly" class="h-10 w-auto dark:hidden">
<img src="/static/logo-dark.svg" alt="Noomly" class="h-10 w-auto hidden dark:block">
</a>
<h1 class="text-3xl font-extrabold mb-2">Welcome back</h1>
<p class="text-slate-500 dark:text-slate-400">Sign in to manage your business</p>
</div>
{% with msgs = get_flashed_messages(with_categories=true) %}{% if msgs %}{% for cat, msg in msgs %}
<div class="mb-6 px-4 py-3 rounded-xl text-sm font-medium {% if cat=='error' %}bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 text-red-700 dark:text-red-400{% else %}bg-green-50 dark:bg-green-500/10 border border-green-200 dark:border-green-500/20 text-green-700 dark:text-green-400{% endif %}">{{ msg }}</div>
{% endfor %}{% endif %}{% endwith %}
<form method="POST" class="space-y-4">
<div>
<label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Email</label>
<input type="email" name="email" required class="w-full px-4 py-3.5 rounded-xl bg-white dark:bg-white/[.04] border border-slate-200 dark:border-white/[.08] text-slate-900 dark:text-white text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition" placeholder="you@example.com">
</div>
<div>
<label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Password</label>
<input type="password" name="password" required class="w-full px-4 py-3.5 rounded-xl bg-white dark:bg-white/[.04] border border-slate-200 dark:border-white/[.08] text-slate-900 dark:text-white text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition" placeholder="Your password">
</div>
<button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-brand-500 to-purple-500 text-white font-bold text-sm hover:opacity-90 transition shadow-lg shadow-brand-500/25 mt-2">Sign In</button>
<p class="text-center text-sm text-slate-500 mt-6">Don't have an account? <a href="/register" class="text-brand-500 hover:text-brand-600 font-semibold">Create one</a></p>
</form>
</div>
</div>
<script>function initTheme(){const t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.classList.add('dark')}else{document.documentElement.classList.remove('dark')}}initTheme();</script>
</body>
</html>
