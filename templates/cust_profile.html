<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Noomly</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{brand:{50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81'}}}}}</script>
<style>*{font-family:'Inter',sans-serif}body{transition:background-color .3s,color .3s}</style>
</head>
<body class="bg-slate-50 dark:bg-[#0a0a0f] text-slate-900 dark:text-slate-100 min-h-screen">
<nav class="sticky top-0 z-50 bg-white/80 dark:bg-[#0a0a0f]/80 backdrop-blur-xl border-b border-slate-200 dark:border-white/5">
<div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
<a href="/" class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-purple-500 flex items-center justify-center shadow-lg shadow-brand-500/30"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div><span class="text-xl font-extrabold tracking-tight">Noomly</span></a>
<div class="flex items-center gap-4"><a href="/customer/dashboard" class="text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-brand-500 transition">Dashboard</a><button onclick="toggleTheme()" class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-white/5 transition"><svg id="sun-icon" class="w-5 h-5 text-slate-600 dark:text-slate-400 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg><svg id="moon-icon" class="w-5 h-5 text-slate-600 dark:text-slate-400 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg></button><div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-400 to-purple-500 flex items-center justify-center text-sm font-bold text-white shadow-lg">{{ current_user.name[0] }}</div><a href="/customer/logout" class="text-sm text-slate-500 hover:text-red-500 transition">Sign Out</a></div>
</div>
</nav>
<main class="max-w-2xl mx-auto px-6 py-8">
{% with msgs = get_flashed_messages(with_categories=true) %}{% if msgs %}{% for cat, msg in msgs %}
<div class="mb-6 px-5 py-4 rounded-xl text-sm font-medium {% if cat=='error' %}bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 text-red-700 dark:text-red-400{% else %}bg-green-50 dark:bg-green-500/10 border border-green-200 dark:border-green-500/20 text-green-700 dark:text-green-400{% endif %}">{{ msg }}</div>
{% endfor %}{% endif %}{% endwith %}
<h2 class="text-2xl font-extrabold mb-6">My Profile</h2>
<div class="bg-white dark:bg-[#111118] border border-slate-200 dark:border-white/5 rounded-2xl p-6">
<form method="POST" class="space-y-4">
<div class="grid grid-cols-2 gap-4">
<div><label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Full Name</label><input type="text" name="name" value="{{ current_user.name }}" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-white/[.04] border border-slate-200 dark:border-white/[.08] text-slate-900 dark:text-white text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition"></div>
<div><label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Phone</label><input type="tel" name="phone" value="{{ current_user.phone or '' }}" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-white/[.04] border border-slate-200 dark:border-white/[.08] text-slate-900 dark:text-white text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition"></div>
</div>
<div><label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Email</label><input type="email" value="{{ current_user.email }}" disabled class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-white/[.02] border border-slate-200 dark:border-white/[.08] text-slate-500 text-sm cursor-not-allowed"></div>
<div><label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">City</label><input type="text" name="city" value="{{ current_user.city or '' }}" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-white/[.04] border border-slate-200 dark:border-white/[.08] text-slate-900 dark:text-white text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition"></div>
<button type="submit" class="px-6 py-3 rounded-xl bg-gradient-to-r from-brand-500 to-purple-500 text-white font-bold text-sm hover:opacity-90 transition shadow-lg shadow-brand-500/25">Save Changes</button>
</form>
</div>
</main>
<script>function initTheme(){const t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.classList.add('dark')}else{document.documentElement.classList.remove('dark')}}function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light')}initTheme();</script>
</body>
</html>
