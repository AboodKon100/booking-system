{% from 'macros.html' import sidebar, topbar with context %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — Noomly</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{brand:{50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81'}}}}}</script>
<style>*{font-family:'Inter',sans-serif}body{transition:background-color .3s,color .3s}.sidebar{width:260px;background:linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%);border-right:1px solid #e2e8f0}.dark .sidebar{background:linear-gradient(180deg,#0f0f17 0%,#111118 100%);border-right-color:rgba(255,255,255,.05)}.nav-item{transition:all .2s;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:500;color:#64748b;cursor:pointer}.dark .nav-item{color:#94a3b8}.nav-item:hover{background:rgba(99,102,241,.06);color:#6366f1}.nav-item.active{background:rgba(99,102,241,.1);color:#6366f1;font-weight:600}.main-content{flex:1;margin-left:260px;overflow-x:hidden}.topbar{background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-bottom:1px solid #e2e8f0}.dark .topbar{background:rgba(10,10,15,.9);border-bottom-color:rgba(255,255,255,.05)}</style>
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 dark:bg-[#0a0a0f] text-slate-900 dark:text-slate-100 min-h-screen flex">
{{ sidebar('Calendar') }}
<div class="main-content">
{{ topbar('Calendar') }}
<main class="p-6 lg:p-8">
<div class="bg-white dark:bg-[#111118] border border-slate-200 dark:border-white/5 rounded-2xl p-6">
<div id="calendar"></div>
</div>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
var cal=new FullCalendar.Calendar(document.getElementById('calendar'),{
initialView:'dayGridMonth',backgroundColor:'transparent',
headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,timeGridWeek,timeGridDay'},
events:'/api/calendar/events',height:'auto',dayMaxEvents:true,nowIndicator:true});
cal.render();
});
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('-translate-x-full')}
function initTheme(){const t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.classList.add('dark')}else{document.documentElement.classList.remove('dark')}}
function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light')}
initTheme();
</script>
</body>
</html>
