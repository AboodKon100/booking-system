<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ code }} — Noomly</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{brand:{50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81'}}}}}</script>
<style>*{font-family:'Inter',sans-serif}body{transition:background-color .3s,color .3s}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.float{animation:float 3s ease-in-out infinite}</style>
</head>
<body class="bg-slate-50 dark:bg-[#0a0a0f] text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md text-center">
<div class="float mb-8">
<div class="w-24 h-24 rounded-full bg-gradient-to-br from-red-400 to-red-500 flex items-center justify-center mx-auto shadow-xl shadow-red-500/30">
<svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
</div>
</div>
<h1 class="text-3xl font-extrabold mb-3 text-slate-900 dark:text-white">{{ code }}</h1>
<p class="text-slate-500 dark:text-slate-400 mb-8">{{ message }}</p>
<div class="flex flex-col sm:flex-row gap-3 justify-center">
<a href="/" class="px-6 py-3 rounded-xl bg-gradient-to-r from-brand-500 to-purple-500 text-white font-bold text-sm hover:opacity-90 transition shadow-lg shadow-brand-500/25">Go Home</a>
<a href="javascript:history.back()" class="px-6 py-3 rounded-xl border-2 border-slate-200 dark:border-white/10 text-slate-700 dark:text-slate-300 font-semibold text-sm hover:bg-slate-100 dark:hover:bg-white/5 transition">Go Back</a>
</div>
</div>
<script>function initTheme(){const t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.classList.add('dark')}else{document.documentElement.classList.remove('dark')}}initTheme();</script>
</body>
</html>
